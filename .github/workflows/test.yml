# The Java suite, run by hand. The Python rig stands
# outside it, which wants an emulator and unicorn; doc/tools.md has it.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The build assembles the 68000 sources at process-classes, the one
      # step rmac is needed for (pom.xml). The version is pinned: Blobs
      # writes the images under go/image/data and BlobTest reads them
      # against a fresh assembly, so another rmac is another set of bytes.
      - name: rmac 2.4.3
        run: |
          curl -fsSL -o /tmp/rmac.zip \
            https://rmac.is-slick.com/static/rmac-2.4.3-lin-x64.zip
          unzip -j -o /tmp/rmac.zip -d /tmp/rmac
          sudo install -m 755 /tmp/rmac/rmac /usr/local/bin/rmac
      # RigCallsTest drives the 68000 reader under emulation and skips
      # where unicorn is absent.
      - run: python3 -m pip install --quiet unicorn
      # St4Test reads the packer this tree carries against the real
      # one, and skips where no executable stands at $ST4 or on the
      # path. ST4 is built at the release go.mod requires, read from
      # go.mod so the two cannot drift.
      - name: ST4's packer at the release go.mod requires
        run: |
          st4=$(grep -oE 'st4/go v[0-9]+\.[0-9]+\.[0-9]+' go/go.mod \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "ST4 $st4"
          git clone --depth 1 --branch "go/v$st4" \
              https://github.com/odipar/ST4 "$RUNNER_TEMP/ST4"
          (cd "$RUNNER_TEMP/ST4/go" && go build -o "$RUNNER_TEMP/bin/" ./cmd/...)
          echo "ST4=$RUNNER_TEMP/bin/st4" >> "$GITHUB_ENV"
      # ParityTest reads the three trees against one another and skips
      # where go, dotnet or rmac is absent, so a runner without one of
      # them is green and asleep.
      - run: go version && dotnet --version && rmac | sed -n '7p'
      # A skipped test is a check that did not run, and a run that skips
      # one is green and asleep. bin/suite (doc/tools.md) requires what
      # the skipping tests need, runs the suite and ends with 1 where the
      # count is above 0; a caller runs the same script here.
      - name: the suite, and no skip
        run: bin/suite
