# The Java suite, run by hand. The Python rig stands
# outside it, which wants an emulator and unicorn; doc/tools.md has it.
name: test

# Off by default: no push and no pull request starts it. A caller starts
# it from the Actions tab, or with `gh workflow run test.yml`.
on:
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The build assembles the 68000 sources at process-classes, the one
      # step rmac is needed for (pom.xml). The version is pinned: Blobs
      # writes the images under go/image/data and BlobTest reads them
      # against a fresh assembly, so another rmac is another set of bytes.
      - name: rmac 2.4.3
        run: |
          curl -fsSL -o /tmp/rmac.zip \
            https://rmac.is-slick.com/static/rmac-2.4.3-lin-x64.zip
          unzip -j -o /tmp/rmac.zip -d /tmp/rmac
          sudo install -m 755 /tmp/rmac/rmac /usr/local/bin/rmac
      # RigCallsTest drives the 68000 reader under emulation and skips
      # where unicorn is absent.
      - run: python3 -m pip install --quiet unicorn
      # ParityTest reads the three trees against one another and skips
      # where go, dotnet or rmac is absent, so a runner without one of
      # them is green and asleep.
      - run: go version && dotnet --version && rmac | sed -n '7p'
      # A skipped test is a check that did not run. One stands here:
      # St4Test reads the real ST4 packer, which is another repository's
      # and stands at $ST4 or on the path, and this tree has neither.
      - name: the suite, and one skip
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress test | tee /tmp/test.log
          skipped=$(grep -oE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$' \
              /tmp/test.log | tail -1 | grep -oE '[0-9]+$')
          if [ "$skipped" != "1" ]; then
              echo "::error::$skipped skipped, and this workflow reads 1"
              grep -E 'Skipped: [1-9]' /tmp/test.log
              exit 1
          fi
